<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="The OpenCode Go capsule below the composer and the panel it opens">
  <!-- Left: the capsule, magnified. -->
  <rect x="60" y="178" width="190" height="64" rx="32" fill="none" stroke="#8a94a6" stroke-width="2"/>
  <circle cx="96" cy="210" r="14" fill="none" stroke="#b3bcc8" stroke-width="3"/>
  <circle cx="96" cy="210" r="14" fill="none" stroke="#0f9d76" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="63.3 24.6" transform="rotate(-90 96 210)"/>
  <rect x="122" y="203" width="42" height="14" rx="7" fill="#8a94a6" fill-opacity="0.55"/>
  <rect x="172" y="203" width="54" height="14" rx="7" fill="#0f9d76" fill-opacity="0.85"/>

  <!-- Right: the panel it opens. -->
  <rect x="300" y="36" width="300" height="236" rx="16" fill="none" stroke="#8a94a6" stroke-width="2"/>
  <circle cx="328" cy="64" r="10" fill="none" stroke="#b3bcc8" stroke-width="2.5"/>
  <circle cx="328" cy="64" r="10" fill="none" stroke="#0f9d76" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="45.2 17.6" transform="rotate(-90 328 64)"/>
  <rect x="346" y="57" width="64" height="12" rx="6" fill="#8a94a6" fill-opacity="0.55"/>
  <rect x="468" y="57" width="104" height="12" rx="6" fill="#0f9d76" fill-opacity="0.8"/>
  <line x1="320" y1="86" x2="580" y2="86" stroke="#8a94a6" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Window 1: 5-hour, 64% used. -->
  <rect x="320" y="102" width="52" height="10" rx="5" fill="#8a94a6" fill-opacity="0.55"/>
  <rect x="464" y="102" width="108" height="10" rx="5" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="320" y="118" width="260" height="6" rx="3" fill="#8a94a6" fill-opacity="0.25"/>
  <rect x="320" y="118" width="166" height="6" rx="3" fill="#0f9d76"/>
  <rect x="320" y="130" width="64" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="536" y="130" width="44" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>

  <!-- Window 2: weekly, 88% used. -->
  <rect x="320" y="152" width="52" height="10" rx="5" fill="#8a94a6" fill-opacity="0.55"/>
  <rect x="464" y="152" width="108" height="10" rx="5" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="320" y="168" width="260" height="6" rx="3" fill="#8a94a6" fill-opacity="0.25"/>
  <rect x="320" y="168" width="229" height="6" rx="3" fill="#d98c1f"/>
  <rect x="320" y="180" width="64" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="536" y="180" width="44" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>

  <!-- Window 3: monthly, exhausted. -->
  <rect x="320" y="202" width="52" height="10" rx="5" fill="#8a94a6" fill-opacity="0.55"/>
  <rect x="464" y="202" width="108" height="10" rx="5" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="320" y="218" width="260" height="6" rx="3" fill="#8a94a6" fill-opacity="0.25"/>
  <rect x="320" y="218" width="260" height="6" rx="3" fill="#d9534f"/>
  <rect x="320" y="230" width="64" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="536" y="230" width="44" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>

  <!-- Footer: the reading age on the left, Refresh on the right. -->
  <line x1="320" y1="246" x2="580" y2="246" stroke="#8a94a6" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="320" y="254" width="92" height="8" rx="4" fill="#8a94a6" fill-opacity="0.35"/>
  <rect x="516" y="250" width="64" height="16" rx="8" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
  <rect x="528" y="255" width="40" height="6" rx="3" fill="#8a94a6" fill-opacity="0.45"/>
</svg>
