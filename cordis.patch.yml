# Bundle patch for dsh-opencode-go-usage.
#
# One row: the Host half of this package (usage reader, browser route, agent
# tool). The browser capsule is discovered from the same row's package manifest
# (`dsh.client` plus the `./client` export), so no second row is needed.
- insert:
    - id: opencode-go-usage
      name: dsh-opencode-go-usage
      config:
        apiKeyEnv: OPENCODE_GO_API_KEY
